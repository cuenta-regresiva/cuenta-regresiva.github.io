<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071a35">
  <title>Mi Cuenta Regresiva</title>

  <style>
    :root {
      --fondo: #030712;
      --panel: #0b1830;
      --azul: #00d9ff;
      --texto: #f1f7ff;
      --secundario: #9bb1ce;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, Arial, sans-serif;
      color: var(--texto);
      background:
        radial-gradient(ellipse at top, #102c54 0%, transparent 60%),
        var(--fondo);
    }

    main {
      width: 100%;
      max-width: 480px;
    }

    .icono {
      width: 92px;
      height: 92px;
      object-fit: contain;
      display: block;
      margin: 0 auto 20px;
    }

    h1 {
      text-align: center;
      font-size: 29px;
      margin: 0 0 8px;
    }

    .intro {
      text-align: center;
      color: var(--secundario);
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .panel {
      background: rgba(11, 24, 48, 0.92);
      border: 1px solid rgba(0, 217, 255, 0.25);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 0 32px rgba(0, 120, 255, 0.10);
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #314765;
      background: #071326;
      color: var(--texto);
      font: inherit;
    }

    input[type="color"] {
      height: 52px;
      padding: 5px;
      cursor: pointer;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      color: #00101a;
      background: var(--azul);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .nota {
      color: var(--secundario);
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      margin-top: 18px;
    }

    footer {
      text-align: center;
      color: #647b99;
      font-size: 12px;
      margin-top: 24px;
    }
  </style>
</head>

<body>
  <main>
    <img
      class="icono"
      src="../icons/icon-192.png"
      alt="Reloj de arena"
    >

    <h1>Mi Cuenta Regresiva</h1>

    <p class="intro">
      Elegí tu evento, configurá la fecha y personalizá
      tu propia cuenta regresiva.
    </p>

    <section class="panel">
      <form id="formulario">
        <label for="evento">Nombre del evento</label>
        <input
          id="evento"
          type="text"
          maxlength="60"
          placeholder="Ej.: Mi próximo viaje"
          required
        >

        <label for="fecha">Fecha del evento</label>
        <input id="fecha" type="date" required>

        <label for="hora">Hora del evento</label>
        <input id="hora" type="time" value="00:00" required>

        <label for="color">Color principal</label>
        <input id="color" type="color" value="#00d9ff">

        <label for="estilo">Estilo del contador</label>
        <select id="estilo">
          <option value="futurista">Futurista</option>
          <option value="minimalista">Minimalista</option>
          <option value="elegante">Elegante</option>
        </select>

        <button type="submit">Guardar y crear mi contador</button>
      </form>

      <p class="nota">
        Tu configuración se guardará en este dispositivo.
        Podrás volver a cambiarla cuando quieras.
      </p>
    </section>

    <footer>
      MI CUENTA REGRESIVA · TU EVENTO, TU TIEMPO
    </footer>
  </main>

  <script>
    const formulario = document.getElementById("formulario");

    const guardado = localStorage.getItem("miCuentaRegresiva");

    if (guardado) {
      try {
        const datos = JSON.parse(guardado);

        document.getElementById("evento").value = datos.evento || "";
        document.getElementById("fecha").value = datos.fecha || "";
        document.getElementById("hora").value = datos.hora || "00:00";
        document.getElementById("color").value = datos.color || "#00d9ff";
        document.getElementById("estilo").value = datos.estilo || "futurista";
      } catch (error) {
        console.warn("No se pudo recuperar la configuración guardada.");
      }
    }

    formulario.addEventListener("submit", function(event) {
      event.preventDefault();

      const datos = {
        evento: document.getElementById("evento").value.trim(),
        fecha: document.getElementById("fecha").value,
        hora: document.getElementById("hora").value,
        color: document.getElementById("color").value,
        estilo: document.getElementById("estilo").value
      };

      const instante = new Date(datos.fecha + "T" + datos.hora);

      if (!datos.evento || !datos.fecha || isNaN(instante.getTime())) {
        alert("Completá el nombre, la fecha y la hora del evento.");
        return;
      }

      if (instante.getTime() <= Date.now()) {
        alert("Elegí una fecha y hora futuras.");
        return;
      }

      try {
        localStorage.setItem("miCuentaRegresiva", JSON.stringify(datos));
        window.location.href = "contador.html";
      } catch (error) {
        alert("No se pudo guardar la configuración en este dispositivo.");
      }
    });
  </script>
</body>
</html>
